<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Management System (DEV)</title>

<style>
:root{
  --bg:#f8fafc;--bg-nav:#f1f5f9;--bg-card:#ffffff;--bg-in:#f1f5f9;
  --bd:#e2e8f0;--bd-err:#fca5a5;--bd-ok:#86efac;--bd-info:#93c5fd;
  --tx:#0f172a;--tx2:#475569;--tx3:#64748b;
  --ac:#d97706;--ac2:#b45309;
  --ok:#059669;--ok-bg:#d1fae5;
  --er:#dc2626;--er-bg:#fee2e2;
  --r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:20px
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
input,textarea,select{outline:none;font-family:inherit}
button{cursor:pointer;font-family:inherit}
#sidebar{width:220px;background:var(--bg-nav);border-right:1px solid var(--bd);padding:20px 12px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#content{flex:1;overflow:auto;padding:28px 32px}
.nav-logo{padding:4px 10px 18px;border-bottom:1px solid var(--bd);margin-bottom:8px}
.nav-logo .t{font-size:17px;font-weight:800;color:var(--ac);letter-spacing:-.03em}
.nav-logo .s{font-size:10px;color:var(--tx3);margin-top:2px}
.ni{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:var(--r-sm);color:var(--tx3);font-size:14px;font-weight:500;border:none;background:none;width:100%;text-align:left;cursor:pointer;transition:all .15s}
.ni:hover{background:var(--bg-in);color:var(--tx)}
.ni.act{background:#fef3c7;color:var(--ac)}
.ni-icon{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.nb{background:var(--bd);color:var(--tx3);font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:auto}
.nav-sep{height:1px;background:var(--bd);margin:8px 4px}
.nav-bot{padding:12px 10px;border-top:1px solid var(--bd);margin-top:auto;font-size:11px;color:var(--tx3)}
.btn{padding:9px 18px;border-radius:var(--r-sm);border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.btn:focus-visible{outline:2px solid #d9770655;outline-offset:2px}
.bp{background:var(--ac);color:var(--bg)}.bp:hover{background:var(--ac2)}
.bg{background:var(--bg-in);color:var(--tx2);border:1px solid var(--bd)}.bg:hover{background:var(--bd);color:var(--tx)}
.bd{background:var(--er-bg);color:var(--er);border:1px solid var(--bd-err)}.bd:hover{background:var(--bd-err)}
.bs{background:var(--ok-bg);color:var(--ok);border:1px solid var(--bd-ok)}.bs:hover{background:var(--bd-ok)}
.btn-sm{padding:5px 11px;font-size:12px}
.inp{background:var(--bg-in);border:1px solid var(--bd);border-radius:var(--r-sm);color:var(--tx);padding:10px 14px;font-size:13px;width:100%;transition:border .15s}
.inp:focus{border-color:rgba(217,119,6,0.45)}
select.inp option{background:var(--bg-in)}
.card{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r-md);padding:20px}
.sc{background:var(--bg-card);border:1px solid var(--bd);border-radius:13px;padding:18px 20px;cursor:pointer;transition:border-color .2s}
.sc:hover{border-color:rgba(217,119,6,0.3)}
.lbl{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;display:block}
.st{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.badge{display:inline-flex;align-items:center;padding:5px 14px;border-radius:6px;font-size:13px;font-weight:700}
.pb{height:3px;background:var(--bd);border-radius:2px;overflow:hidden;margin-top:6px}
.pf{height:100%;border-radius:2px}
.mpanel{background:var(--bg-card);border:1px solid var(--bd);border-radius:14px;display:grid;grid-template-columns:repeat(4,1fr)}
.mc{padding:18px 20px;cursor:pointer;transition:background .15s;border-right:1px solid var(--bd)}
.mc:last-child{border-right:none}
.mc:hover{background:var(--bg-in)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}
.mono{font-family:'SFMono-Regular','Menlo','Monaco','Consolas',monospace}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:10px 14px;font-size:12px;font-weight:700;color:var(--tx3);text-transform:uppercase;border-bottom:1px solid var(--bd);cursor:pointer;user-select:none;white-space:nowrap}
.tbl th:hover{color:var(--tx2)}
.tbl th .sa{font-size:10px;margin-left:4px;opacity:.5}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--bd);font-size:13px}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg-in)}
.stag{font-size:12px;padding:4px 12px;border-radius:20px;font-weight:700;background:var(--bg-in);color:var(--tx2)}
.search-bar{position:relative;max-width:320px}
.search-bar input{padding-left:36px;background:var(--bg-nav);border:1px solid var(--bd)}
.search-bar::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:16px;pointer-events:none}
#timer-bar{position:sticky;top:0;z-index:100;background:rgba(248,250,252,0.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:10px 28px;display:none;align-items:center;gap:14px}
#modal-ov{display:none;position:fixed;inset:0;background:#00000099;backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center}
#modal-ov.open{display:flex}
.mbox{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r-lg);padding:28px;width:540px;max-width:95vw;max-height:90vh;overflow-y:auto}
.mfooter{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
.fr{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.cp{display:flex;gap:7px;flex-wrap:wrap}
.cs{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border .15s}
.cs.sel{border-color:#fff}
#confirm-ov{display:none;position:fixed;inset:0;background:#000000bb;backdrop-filter:blur(8px);z-index:300;align-items:center;justify-content:center}
#confirm-ov.open{display:flex}
.cbox{background:var(--bg-card);border:1px solid var(--bd);border-radius:16px;padding:28px;width:380px;max-width:92vw;text-align:center}
.cbox h3{font-size:16px;font-weight:700;margin-bottom:10px}
.cbox p{font-size:14px;color:var(--tx2);margin-bottom:22px;line-height:1.5}
#toasts{position:fixed;top:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 20px;border-radius:var(--r-sm);font-size:13px;font-weight:600;transform:translateX(120%);transition:transform .3s cubic-bezier(.4,0,.2,1);pointer-events:auto;max-width:340px}
.toast.show{transform:translateX(0)}
.toast-success{background:var(--ok-bg);color:var(--ok);border:1px solid var(--bd-ok)}
.toast-error{background:var(--er-bg);color:var(--er);border:1px solid var(--bd-err)}
.toast-info{background:#eff6ff;color:#1d4ed8;border:1px solid var(--bd-info)}
#err-bar{display:none;background:var(--er-bg);border-bottom:1px solid var(--bd-err);padding:10px 28px;font-size:13px;color:var(--er);align-items:center;gap:10px}
#sync{display:none;position:fixed;bottom:20px;right:20px;background:var(--bg-in);border:1px solid #d9770644;color:var(--ac);padding:8px 16px;border-radius:9px;font-size:12px;font-weight:600;z-index:300}
#setup{display:none;align-items:center;justify-content:center;min-height:100vh;padding:24px;flex:1}
.sbox{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r-xl);padding:40px;max-width:460px;width:100%}
.cbar{display:flex;align-items:flex-end;gap:6px;height:150px;padding-bottom:22px;position:relative}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.binn{width:100%;background:var(--bd);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.bfil{position:absolute;bottom:0;left:0;right:0;background:var(--ac);border-radius:3px 3px 0 0}
.blab{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--tx3);white-space:nowrap}
#hamburger{display:none;position:fixed;top:14px;left:14px;z-index:60;background:var(--bg-in);border:1px solid var(--bd);color:var(--tx);font-size:22px;width:42px;height:42px;border-radius:var(--r-sm);align-items:center;justify-content:center;cursor:pointer}
#sidebar-ov{display:none;position:fixed;inset:0;background:#00000088;z-index:40}
@media(max-width:768px){
  #sidebar{position:fixed;left:-260px;top:0;width:250px;transition:left .25s;z-index:50;height:100vh}
  #sidebar.open{left:0}
  #sidebar-ov.open{display:block}
  #hamburger{display:flex}
  #content{padding:18px 16px;padding-top:60px}
  .mpanel{grid-template-columns:1fr 1fr}
  .mc:nth-child(even){border-right:none}
  .mc:nth-child(3),.mc:nth-child(4){border-top:1px solid var(--bd)}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g5{grid-template-columns:repeat(2,1fr)}
  .g6{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr}
  .mbox{padding:20px;width:95vw}
  #timer-bar{padding:10px 16px;padding-left:60px}
  .search-bar{max-width:100%}
  .btn{min-height:44px}
}
.tl{display:flex;align-items:flex-start;gap:0;margin:16px 0;overflow-x:auto;padding-bottom:4px}
.tl-step{flex:1;min-width:90px;display:flex;flex-direction:column;align-items:center;position:relative}
.tl-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);z-index:2;transition:all .2s}
.tl-dot.done{background:var(--ok);border-color:var(--ok)}
.tl-dot.active{background:var(--ac);border-color:var(--ac);transform:scale(1.25)}
.tl-dot.future{background:var(--bg);border-color:var(--bd)}
.tl-line{position:absolute;top:6px;left:50%;width:100%;height:2px;background:var(--bd);z-index:1}
.tl-line.done{background:var(--ok)}
.tl-label{font-size:10px;font-weight:700;color:var(--tx3);margin-top:8px;text-align:center;text-transform:uppercase;letter-spacing:.04em}
.tl-label.done{color:var(--ok)}.tl-label.active{color:var(--ac)}
.tl-date{font-size:10px;color:var(--tx3);margin-top:2px;font-family:'SFMono-Regular','Menlo','Monaco','Consolas',monospace}
#tt{display:none;position:fixed;pointer-events:none;z-index:9999;background:var(--bg-card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--tx);white-space:nowrap;box-shadow:0 4px 24px #00000088}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="boot-msg" style="position:fixed;inset:0;background:#f8fafc;color:#d97706;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;z-index:9999;font-family:sans-serif">Načítám aplikaci…</div>
<div id="confirm-ov" onclick="if(event.target===this)closeConfirm()">

</div>
<div id="setup"><div class="sbox">

</div></div>
<div id="app" style="display:none;flex:1">

    <button class="ni" data-v="invoices" onclick="nav(this)"><span class="ni-icon">◻</span>Faktury<span class="nb" id="bi">0</span></button>

    <div class="nav-sep"></div>
    <button class="ni" data-v="settings" onclick="nav(this)"><span class="ni-icon">⚙</span>Nastavení</button>
    <div class="nav-bot"><div id="nav-rev-lbl">Obrat letos</div><div class="mono" id="nav-rev" style="color:var(--ac);font-weight:800;font-size:14px">0 Kč</div></div>
  </nav>
  <div id="main">

      <div style="flex:1"><div style="font-size:12px;color:#64748b" id="ton"></div>

      <div class="mono" id="tdisp" style="font-size:28px;font-weight:600;color:var(--ac)">00:00:00</div>
      <button class="btn bd" onclick="stopTimer()" aria-label="Zastavit časovač a uložit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="vertical-align:-0.18em;flex-shrink:0;display:inline-block"><path d="M5 8.2002V15.8002C5 16.9203 5 17.4796 5.21799 17.9074C5.40973 18.2837 5.71547 18.5905 6.0918 18.7822C6.5192 19 7.07899 19 8.19691 19H15.8036C16.9215 19 17.4805 19 17.9079 18.7822C18.2842 18.5905 18.5905 18.2837 18.7822 17.9074C19 17.48 19 16.921 19 15.8031V8.19691C19 7.07899 19 6.5192 18.7822 6.0918C18.5905 5.71547 18.2842 5.40973 17.9079 5.21799C17.4801 5 16.9203 5 15.8002 5H8.2002C7.08009 5 6.51962 5 6.0918 5.21799C5.71547 5.40973 5.40973 5.71547 5.21799 6.0918C5 6.51962 5 7.08009 5 8.2002Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Uložit</button>
    </div>
    <main id="content"></main>
  </div>
</div>
<div id="modal-ov" onmousedown="_ovMouseDown=(event.target===this)" onclick="if(event.target===this&&_ovMouseDown)closeModal()"><div class="mbox" id="mbox" role="dialog" aria-modal="true" aria-labelledby="mbox-title"></div></div>
<div id="sync">⟳ Ukládám…</div>

function normalizeInvoices(invs){

    if(action==='create'){d=Object.assign({},payload.data);d.id=devNextId(sheet);DB[sheet].push(d);}
    if(action==='update'){var i=DB[sheet].findIndex(function(r){return r.id===payload.id;});d=Object.assign({},payload.data,{id:payload.id});if(i>-1)DB[sheet][i]=d;}
    if(action==='delete'){d={id:payload.id};DB[sheet]=DB[sheet].filter(function(r){return r.id!==payload.id;});}
    devPersist();badges();render();return d;
  }
  $('sync').style.display='block';
  try{var res=await apiPost({action:action,sheet:sheet,...payload});var d=res.data;
    if(action==='create')DB[sheet].push(d);
    if(action==='update'){var i=DB[sheet].findIndex(r=>r.id===d.id);if(i>-1)DB[sheet][i]=d;}
    if(action==='delete')DB[sheet]=DB[sheet].filter(r=>r.id!==d.id);
    badges();render();return d;
  }catch(err){showErr(err.message);toast(err.message,'error');}
  finally{$('sync').style.display='none';}
}

function getMilestones(o){if(!o.milestones)return[];if(Array.isArray(o.milestones))return o.milestones;try{return JSON.parse(o.milestones);}catch(e){return[];}}

function renderTimeline(o,oInvs,paidInv,sentInv){
  var custom=getMilestones(o);
  var isPaid=o.status==='completed';
  var isInv=!!(sentInv||isPaid);
  var overDL=o.deadline&&new Date()>new Date(o.deadline);

  // 5 fixed milestones (Odevzdáno inserted by date below)
  var fixed=[
    {key:'created',  label:'Přijetí',      date:o.created,   done:true,   over:false, editable:'created'},
    {key:'deadline', label:o.deadline?'Deadline':'Deadline (neurčen)', date:o.deadline, done:isPaid, over:!isPaid&&overDL, editable:'deadline'},
    {key:'invoiced', label:'Fakturováno',   date:sentInv?sentInv.issued:'',  done:isInv, over:false, editable:false},
    {key:'paid',     label:'Zaplaceno',     date:paidInv?(paidInv.paidDate||paidInv.issued):'', done:isPaid, over:false, editable:false}
  ];

  // Build date range
  var today=new Date(); today.setHours(12,0,0,0);
  var allTs=[today.getTime()];
  fixed.forEach(function(m){if(m.date)allTs.push(new Date(m.date).getTime());});
  custom.forEach(function(m){if(m.date)allTs.push(new Date(m.date).getTime());});
  if(o.delivered)allTs.push(new Date(o.delivered).getTime());
  var minD=Math.min.apply(null,allTs);
  var maxD=Math.max.apply(null,allTs);
  if(maxD-minD<30*86400000)maxD=minD+30*86400000;
  var range=maxD-minD;
  function dpct(d){return Math.min(96,Math.max(3,Math.round((new Date(d).getTime()-minD)/range*93)+3));}

  // Build axis items — all dated items sorted chronologically
  var axisItems=[];
  fixed.forEach(function(m){
    if(!m.date)return;
    var col=m.done?'#10b981':m.over?'#f87171':'#94a3b8';
    axisItems.push({pct:dpct(m.date),type:'fixed',label:m.label,date:m.date,col:col,done:m.done});
  });
  custom.forEach(function(m,i){
    if(!m.date)return;
    axisItems.push({pct:dpct(m.date),type:'custom',label:m.label,date:m.date,col:m.done?'#8b5cf6':'#475569',done:m.done,idx:i});
  });
  if(o.delivered){
    var onT=o.deadline?o.delivered<=o.deadline:true;
    axisItems.push({pct:dpct(o.delivered),type:'fixed',label:'Odevzdáno',date:o.delivered,col:onT?'#10b981':'#f87171',done:true});
  }
  axisItems.sort(function(a,b){return a.pct-b.pct;});

  // Undated fixed milestones — append at right with spacing
  var undated=fixed.filter(function(m){return !m.date;});
  var lastPct=axisItems.length?axisItems[axisItems.length-1].pct:55;
  var gap=undated.length?Math.max(6,Math.floor((97-lastPct)/(undated.length+1))):0;
  undated.forEach(function(m,i){
    var col=m.done?'#10b981':m.over?'#f87171':'#94a3b8';
    axisItems.push({pct:Math.min(97,lastPct+gap*(i+1)),type:'fixed',label:m.label,date:'',col:col,done:m.done});
  });

  // Render axis
  var axisHTML='<div style="position:relative;height:80px;margin:8px 0 4px 0">'
    +'<div style="position:absolute;top:22px;left:0;right:0;height:2px;background:var(--bd)"></div>';
  for(var k=0;k<axisItems.length-1;k++){
    var a=axisItems[k],b=axisItems[k+1];
    var lc=a.done&&b.done?'#059669':a.done?'#05966933':'#e2e8f0';
    axisHTML+='<div style="position:absolute;top:22px;left:'+a.pct+'%;width:'+(b.pct-a.pct)+'%;height:2px;background:'+lc+'"></div>';
  }
  // Anti-overlap: track claimed x-ranges per row
  var usedR=[];
  function claimRow(pct,estW){
    var l=pct-estW/2,r=pct+estW/2;
    for(var row=0;row<8;row++){
      var ok=true;
      for(var u=0;u<usedR.length;u++){if(usedR[u].row===row&&r>usedR[u].l-1&&l<usedR[u].r+1){ok=false;break;}}
      if(ok){usedR.push({l:l,r:r,row:row});return row;}
    }
    return 0;
  }
  var bTops=[38,54,70,86];var aTops=[-22,-38,-54,-70];
  axisItems.forEach(function(item,k){
    var isF=item.type==='fixed';
    var sz=isF?12:8;var half=Math.floor(sz/2);
    var dot='<div style="position:absolute;top:'+(22-half)+'px;left:calc('+item.pct+'% - '+half+'px);width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+(item.done?item.col:'var(--bg)')+';border:2px solid '+item.col+';z-index:2;box-shadow:0 0 0 2px var(--bg)"></div>';

function showAddMilestone(oid){
  var f=$('ml-form-'+oid);
  if(f){f.style.display=f.style.display==='none'?'block':'none';var inp=$('ml-label-'+oid);if(inp&&f.style.display!=='none')inp.focus();}
}
async function addMilestone(oid){
  var label=($('ml-label-'+oid)&&$('ml-label-'+oid).value.trim());var date=($('ml-date-'+oid)&&$('ml-date-'+oid).value);
  var note=($('ml-note-'+oid)&&$('ml-note-'+oid).value.trim());
  if(!label)return toast('Zadej název milníku','error');
  var o=go(oid);var ms=getMilestones(o);ms.push({label:label,date:date,note:note||'',done:false});
  await saveMilestones(oid,ms);
}
async function toggleMilestone(oid,idx){
  var o=go(oid);var ms=getMilestones(o);ms[idx].done=!ms[idx].done;await saveMilestones(oid,ms);
}
async function delMilestone(oid,idx){
  var o=go(oid);var ms=getMilestones(o);ms.splice(idx,1);await saveMilestones(oid,ms);
}
async function saveMilestones(oid,ms){
  var o=go(oid);if(!o)return toast('Zakázka nenalezena','error');
  // Vytvořit čistý datový objekt bez problematických referencí
  var data=Object.assign({},o,{milestones:JSON.stringify(ms)});
  // Zajistit že delivered zůstane
  if(o.delivered)data.delivered=o.delivered;
  var result=await mut('update','orders',{id:oid,data:data});
  if(result)vOrderDetail(oid);
}

function cpick(sel,varN){return '<div class="cp">'+COLORS.map(function(c){return '<div class="cs'+(c===sel?' sel':'')+'" style="background:'+c+'" onclick="'+varN+'=\''+c+'\';document.querySelectorAll(\'.cs\').forEach(function(x){x.classList.remove(\'sel\');});this.classList.add(\'sel\')"></div>';}).join('')+'</div>';}
var _modalPrevFocus=null;var _ovMouseDown=false;
function openModal(h){
  var box=$('mbox');box.innerHTML=h;
  $('modal-ov').classList.add('open');
  _modalPrevFocus=document.activeElement;
  var first=box.querySelector('button,input,select,textarea,[tabindex]:not([tabindex="-1"])');
  if(first)first.focus();
  box.addEventListener('keydown',_modalTrap);
}
function _modalTrap(e){
  if(e.key!=='Tab')return;
  var box=$('mbox');
  var els=Array.from(box.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'));
  if(!els.length)return;
  var first=els[0],last=els[els.length-1];
  if(e.shiftKey){if(document.activeElement===first){e.preventDefault();last.focus();}}
  else{if(document.activeElement===last){e.preventDefault();first.focus();}}
}
function closeModal(){
  var box=$('mbox');
  box.removeEventListener('keydown',_modalTrap);
  $('modal-ov').classList.remove('open');
  INV_EDIT_ID=null;_EDIT_INV=null;
  if(_modalPrevFocus)try{_modalPrevFocus.focus();}catch(e){}
}

  toast(id?'Zakázka aktualizována':'Zakázka vytvořena','success');
}
function openCM(id){
  var c=id?gc(id):null;FC=c?c.color:autoAssignColor();
  openModal('<div style="font-size:18px;font-weight:800;margin-bottom:20px">'+(c?'Upravit klienta':'Nový klient')+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px"><div class="fr" style="margin:0"><label class="lbl" for="fn">Jméno *</label><input class="inp" id="fn" value="'+e((c&&c.name||''))+'"></div><div class="fr" style="margin:0"><label class="lbl" for="fco">Firma</label><input class="inp" id="fco" value="'+e((c&&c.company||''))+'"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px"><div class="fr" style="margin:0"><label class="lbl" for="fem">Email</label><input class="inp" type="email" id="fem" value="'+e((c&&c.email||''))+'"></div><div class="fr" style="margin:0"><label class="lbl" for="fph">Telefon</label><input class="inp" type="text" id="fph" value="'+e((c&&c.phone||''))+'"></div></div><div class="fr"><label class="lbl" for="fad">Adresa</label><input class="inp" id="fad" value="'+e((c&&c.address||''))+'"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px"><div class="fr" style="margin:0"><label class="lbl" for="fci">Město</label><input class="inp" id="fci" value="'+e((c&&c.city||''))+'"></div><div class="fr" style="margin:0"><label class="lbl" for="fzi">PSČ</label><input class="inp" id="fzi" value="'+e((c&&c.zip||''))+'"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px"><div class="fr" style="margin:0"><label class="lbl" for="fico">IČO</label><input class="inp" id="fico" value="'+e((c&&c.ico||''))+'"></div><div class="fr" style="margin:0"><label class="lbl" for="fdic">DIČ</label><input class="inp" id="fdic" value="'+e((c&&c.dic||''))+'"></div></div><div class="fr"><label class="lbl" for="fno">Poznámky</label><textarea class="inp" id="fno" rows="2" style="resize:vertical">\'+(c&&c.notes||\'\')+\'</textarea></div><div class="fr"><label class="lbl">Barva</label>'+cpick(FC,'FC')+'</div><div class="mfooter"><button class="btn bg" onclick="closeModal()">Zrušit</button><button class="btn bp" onclick="saveC('+((c&&c.id||0))+')">Uložit</button></div>');
}
async function saveC(id){var name=$('fn').value.trim();if(!name)return toast('Zadej jméno','error');var data={name:name,company:$('fco').value,email:$('fem').value,phone:$('fph').value,address:$('fad').value,city:$('fci').value,zip:$('fzi').value,ico:$('fico').value,dic:$('fdic').value,notes:$('fno').value,color:FC};closeModal();if(id)await mut('update','clients',{id:id,data:Object.assign({},gc(id),data)});else await mut('create','clients',{data:data});toast(id?'Klient aktualizován':'Klient vytvořen','success');}

function openEM(oid){
  var ao=DB.orders.filter(function(o){return o.status==='active';});
  var opts=ao.map(function(o){return '<option value="'+o.id+'"'+(o.id===oid?' selected':'')+'>'+e(o.name)+'</option>';}).join('');
  openModal('<div style="font-size:18px;font-weight:800;margin-bottom:20px">Ruční záznam</div><div class="fr"><label class="lbl" for="fao">Zakázka</label><select class="inp" id="fao">'+opts+'</select></div><div class="fr"><label class="lbl" for="fed">Popis</label><input class="inp" id="fed" placeholder="Co jste dělali..."></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px"><div class="fr" style="margin:0"><label class="lbl" for="fh">Hodiny</label><input class="inp" type="number" min="0" id="fh" placeholder="0"></div><div class="fr" style="margin:0"><label class="lbl" for="fm">Minuty</label><input class="inp" type="number" min="0" max="59" id="fm" placeholder="0"></div></div><div class="fr"><label class="lbl" for="fdt">Datum</label><input class="inp" type="date" id="fdt" value="'+today()+'"></div><div class="mfooter"><button class="btn bg" onclick="closeModal()">Zrušit</button><button class="btn bp" onclick="saveE('+(oid||0)+')">Uložit</button></div>');
}
async function saveE(returnOid){var dur=(Number($('fh').value)||0)*3600+(Number($('fm').value)||0)*60;if(!dur)return toast('Zadej dobu práce','error');var data={orderId:Number($('fao').value),description:$('fed').value||'Práce',duration:dur,date:$('fdt').value};closeModal();await mut('create','entries',{data:data});toast('Záznam uložen','success');if(returnOid)vOrderDetail(returnOid);}

function openExpM(oid){
  var cats=EXP_CATS.map(function(c){return '<option>'+c+'</option>';}).join('');
  openModal('<div style="font-size:18px;font-weight:800;margin-bottom:20px">Nový náklad</div><div class="fr"><label class="lbl" for="exd">Popis *</label><input class="inp" id="exd" placeholder="Popis nákladu..."></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px"><div class="fr" style="margin:0"><label class="lbl" for="exa">Částka (Kč) *</label><input class="inp" type="number" id="exa" placeholder="0"></div><div class="fr" style="margin:0"><label class="lbl" for="exc">Kategorie</label><select class="inp" id="exc">'+cats+'</select></div></div><div class="fr"><label class="lbl" for="exdt">Datum</label><input class="inp" type="date" id="exdt" value="'+today()+'"></div><div class="mfooter"><button class="btn bg" onclick="closeModal()">Zrušit</button><button class="btn bp" onclick="saveExp('+oid+')">Uložit</button></div>');
}
async function saveExp(oid){var desc=$('exd').value.trim();var amt=Number($('exa').value);if(!desc||!amt)return toast('Vyplň popis a částku','error');var data={orderId:oid,description:desc,amount:amt,category:$('exc').value,date:$('exdt').value};closeModal();await mut('create','expenses',{data:data});toast('Náklad přidán','success');vOrderDetail(oid);}

function openNoteM(oid){
  openModal('<div style="font-size:18px;font-weight:800;margin-bottom:20px">Nová poznámka</div><div class="fr"><label class="lbl" for="ntxt">Text poznámky</label><textarea class="inp" id="ntxt" rows="4" style="resize:vertical" placeholder="Vaše poznámka..."></textarea></div><div class="mfooter"><button class="btn bg" onclick="closeModal()">Zrušit</button><button class="btn bp" onclick="saveNote('+oid+')">Uložit</button></div>');
}
async function saveNote(oid){var txt=$('ntxt').value.trim();if(!txt)return toast('Zadej text poznámky','error');var data={orderId:oid,text:txt,created:today()};closeModal();await mut('create','notes',{data:data});toast('Poznámka přidána','success');vOrderDetail(oid);}
function openEditNoteM(id,oid){
  var n=DB.notes.find(function(x){return x.id===id;});if(!n)return;
  openModal('<div style="font-size:18px;font-weight:800;margin-bottom:20px">Upravit poznámku</div><div class="fr"><label class="lbl" for="ntxt">Text poznámky</label><textarea class="inp" id="ntxt" rows="4" style="resize:vertical">'+e(n.text||'')+'</textarea></div><div class="mfooter"><button class="btn bg" onclick="closeModal()">Zrušit</button><button class="btn bp" onclick="saveEditNote('+id+','+oid+')">Uložit</button></div>');
}
async function saveEditNote(id,oid){var txt=$('ntxt').value.trim();if(!txt)return toast('Zadej text poznámky','error');var n=DB.notes.find(function(x){return x.id===id;});if(!n)return;closeModal();await mut('update','notes',{id:id,data:Object.assign({},n,{text:txt})});toast('Poznámka upravena','success');vOrderDetail(oid);}

function editInv(id){
  _EDIT_INV=DB.invoices.find(function(x){return Number(x.id)===Number(id);})||null;
  openIM(_EDIT_INV?_EDIT_INV.id:0);
}
function openIM(editId){
  INV_EDIT_ID=editId||null;
  var inv=editId?(_EDIT_INV&&Number(_EDIT_INV.id)===Number(editId)?_EDIT_INV:DB.invoices.find(function(x){return Number(x.id)===Number(editId);})):null;
  _EDIT_INV=null;
  // Support both single orderId (legacy) and orderIds array
  var invOrderIds=inv?(Array.isArray(inv.orderIds)&&inv.orderIds.length?inv.orderIds.map(Number):(inv.orderId?[Number(inv.orderId)]:[])):[];
  var needsRepair=editId&&inv&&(!Array.isArray(inv.orderIds)||!inv.orderIds.length);
  var allOrders=DB.orders.filter(function(o){return o.status==='active'||invOrderIds.indexOf(o.id)>=0;});
  var rawItems=[];
  if(inv){
    if(Array.isArray(inv.items))rawItems=inv.items;
    else if(typeof inv.items==='string'&&inv.items){try{rawItems=JSON.parse(inv.items);}catch(e){rawItems=[];}}
  }
  INV_ITEMS=rawItems.map(function(it){return{desc:it.desc||'',note:it.note||'',qty:Number(it.qty)||1,price:Number(it.price)||0};});
  var autoNum=inv?inv.number:nin();
  var orderChecks=allOrders.map(function(o){var sel=invOrderIds.indexOf(o.id)>=0;return '<label style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;'+(sel?'background:var(--bg-in);':'')+'hover:background:var(--bg-in)"><input type="checkbox" class="inv-order-cb" value="'+o.id+'"'+(sel?' checked':'')+' onchange="updateInvInfo()" style="width:15px;height:15px;accent-color:var(--ac)"><span style="font-size:13px;font-weight:600">'+e(o.name)+'</span><span style="font-size:12px;color:#64748b;margin-left:4px">'+e((gc(o.clientId)&&gc(o.clientId).company||gc(o.clientId)&&gc(o.clientId).name||''))+'</span><span class="mono" style="font-size:11px;color:var(--ac);margin-left:auto">'+fmtM(o.price)+'</span></label>';}).join('');
  openModal('<div style="font-size:18px;font-weight:800;margin-bottom:20px">'+(editId?'Upravit fakturu':'Nová faktura')+'</div>'+(needsRepair?'<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#d97706">⚠ Tato faktura byla vytvořena bez uložení propojených zakázek. Zaškrtni všechny patřičné zakázky a ulož — propojení se tím opraví.</div>':'')
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:13px">'
    +'<div class="fr" style="margin:0"><label class="lbl" for="finv">Číslo faktury</label><input class="inp" id="finv" value="'+autoNum+'"></div>'
    +'<div class="fr" style="margin:0"><label class="lbl" for="fiss">Datum vystavení</label><input class="inp" type="date" id="fiss" value="'+(inv?inv.issued:today())+'"></div>'
    +'<div class="fr" style="margin:0"><label class="lbl" for="fduzp">Datum UZP</label><input class="inp" type="date" id="fduzp" value="'+(inv?inv.duzp||inv.issued:today())+'"></div>'
    +'</div>'
    +'<div class="fr"><label class="lbl">Zakázky</label><div style="border:1px solid var(--bd);border-radius:10px;max-height:160px;overflow-y:auto;padding:4px">'+orderChecks+'</div></div>'
    +'<div id="iinfo" style="background:var(--bg-in);border-radius:9px;padding:11px;font-size:12px;color:#64748b;margin-bottom:13px"></div>'
    +'<div class="fr"><label class="lbl" for="frec">Příjemce</label><input class="inp" id="frec"></div>'
    +'<div id="iitems"></div>'
    +'<button class="btn bg btn-sm" style="margin-bottom:13px" onclick="addII()">+ Přidat položku</button>'
    +'<div id="itot" class="mono" style="text-align:right;font-size:15px;font-weight:800;color:var(--ac);margin-bottom:13px">Celkem: 0 Kč</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:13px">'
    +'<div class="fr" style="margin:0"><label class="lbl" for="fdu">Splatnost</label><input class="inp" type="date" id="fdu" value="'+(inv?inv.dueDate:dueIn(14))+'"></div>'
    +'<div class="fr" style="margin:0"><label class="lbl" for="fcu">Měna</label><select class="inp" id="fcu"><option'+((!inv||inv.currency==='CZK')?' selected':'')+'>CZK</option><option'+(inv&&inv.currency==='EUR'?' selected':'')+'>EUR</option><option'+(inv&&inv.currency==='USD'?' selected':'')+'>USD</option></select></div>'
    +'<div class="fr" style="margin:0"><label class="lbl" for="fpm">Způsob platby</label><select class="inp" id="fpm"><option value="hotovost"'+((!inv||!inv.paymentMethod||inv.paymentMethod==='hotovost')?' selected':'')+'>Hotovost</option><option value="prevodem"'+(inv&&inv.paymentMethod==='prevodem'?' selected':'')+'>Převodem</option><option value="karta"'+(inv&&inv.paymentMethod==='karta'?' selected':'')+'>Platební karta</option></select></div>'
    +'</div>'
    
    +'<div class="mfooter"><button class="btn bg" onclick="closeModal()">Zrušit</button><button class="btn bp" onclick="saveI('+(editId||0)+')">Uložit</button></div>'); 
  if(inv&&$('frec'))$('frec').value=inv.recipient||'';
  if(inv&&$('fcu'))$('fcu').value=inv.currency||'CZK';
  renderII();calcItot();
  updateInvInfo();
  if(!editId&&INV_ITEMS.length===0)addII();
}
function getSelectedOrderIds(){return Array.from(document.querySelectorAll('.inv-order-cb:checked')).map(function(cb){return Number(cb.value);});}
function updateInvInfo(){
  var oids=getSelectedOrderIds();
  var orders=oids.map(go).filter(Boolean);
  var iinfo=$('iinfo');if(!iinfo)return;
  if(!orders.length){iinfo.innerHTML='<span style="color:#475569">Vyberte alespoň jednu zakázku</span>';return;}
  var totalTime=oids.reduce(function(s,id){return s+ts(id);},0);
  var totalVal=orders.reduce(function(s,o){return s+(o.price||0);},0);
  var totalExp=oids.reduce(function(s,id){return s+expSum(id);},0);
  // Auto-fill příjemce z prvního klienta (jen pokud je prázdný)
  var frec=$('frec');
  if(frec&&!frec.value){var cl=gc(orders[0].clientId);if(cl)frec.value=cl.company||cl.name;}
  iinfo.innerHTML='<strong style="color:var(--tx)">'+orders.map(function(o){return e(o.name);}).join(', ')+'</strong><br>'
    +'Odpracováno: <span style="color:#8b5cf6">'+fmtDur(totalTime)+'</span>'
    +' · Hodnota: <span style="color:var(--ac)">'+fmtM(totalVal)+'</span>'
    +' · Náklady: <span style="color:#ef4444">'+fmtM(totalExp)+'</span>';
  // Auto-fill položek pro NOVOU fakturu
  // Podmínka: buď žádné položky, nebo všechny položky jsou "prázdné" (nevyplněné)
  // Auto-fill POUZE pro novou fakturu (ne při editaci) a pouze když jsou položky prázdné
  if(!INV_EDIT_ID){
    var allEmpty=INV_ITEMS.every(function(it){return !it.desc&&!it.price;});
    if(allEmpty&&orders.length>0){
      INV_ITEMS=orders.map(function(ord){
        return {desc:'',note:ord.name||'',qty:1,price:ord.price||0};
      });
      renderII();calcItot();
    }
  }
}
function addII(){INV_ITEMS.push({desc:'',note:'',qty:1,price:''});renderII();}
function remII(i){INV_ITEMS.splice(i,1);renderII();}
function updII(i,k,v){INV_ITEMS[i][k]=v;calcItot();}
function getItemSuggestions(){
  var seen={};
  DB.invoices.forEach(function(inv){
    var items=Array.isArray(inv.items)?inv.items:[];
    items.forEach(function(it){if(it.desc&&it.desc.trim())seen[it.desc.trim()]=it.price||0;});
  });
  return Object.keys(seen).map(function(k){return {desc:k,price:seen[k]};});
}
function renderII(){
  var el=$('iitems');if(!el)return;
  var suggs=getItemSuggestions();
  var dlId='ii-sugg-list';
  var dl=suggs.length?'<datalist id="'+dlId+'">'+suggs.map(function(s){return '<option value="'+e(s.desc)+'">';}).join('')+'</datalist>':'';
  el.innerHTML=dl+INV_ITEMS.map(function(it,i){
    return '<div style="border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg-in)">'
      +'<div style="display:grid;grid-template-columns:1fr 70px 110px 32px;gap:6px;margin-bottom:6px;align-items:center">'
      +'<input class="inp" list="'+dlId+'" placeholder="Položka *" value="'+e(it.desc)+'" oninput="updIIDesc('+i+',this.value)" style="font-weight:600">'
      +'<input class="inp" type="number" placeholder="Ks" value="'+it.qty+'" oninput="updII('+i+',\'qty\',this.value)" style="text-align:center">'
      +'<input class="inp" id="ii-price-'+i+'" type="number" placeholder="Cena Kč" value="'+it.price+'" oninput="updII('+i+',\'price\',this.value)">'
      +'<button class="btn bd btn-sm" style="padding:0 8px;height:100%" onclick="remII('+i+')" aria-label="Odebrat položku">'+ic('trash')+'</button>'
      +'</div>'
      +'<input class="inp" placeholder="Popis (volitelné)" value="'+e(it.note||'')+'" oninput="updII('+i+',\'note\',this.value)" style="font-size:12px;color:#94a3b8">'
      +'</div>';
  }).join('');
}
function updIIDesc(i,v){
  INV_ITEMS[i].desc=v;
  var suggs=getItemSuggestions();
  var match=suggs.find(function(s){return s.desc===v;});
  if(match&&!INV_ITEMS[i].price){INV_ITEMS[i].price=match.price;var el=$('ii-price-'+i);if(el)el.value=match.price;}
  calcItot();
}
function calcItot(){var tot=INV_ITEMS.reduce(function(s,it){return s+(Number(it.qty)||0)*(Number(it.price)||0);},0);var el=$('itot');if(el)el.textContent='Celkem: '+fmtM(tot);}
async function saveI(editId){
  var items=INV_ITEMS.map(function(it){return{desc:it.desc,note:it.note||'',qty:Number(it.qty)||1,price:Number(it.price)||0};});
  var amount=items.reduce(function(s,it){return s+it.qty*it.price;},0);
  if(!amount)return toast('Přidej alespoň jednu položku s cenou','error');
  var oids=getSelectedOrderIds();
  var oid=oids[0]||0;
  var o=go(oid);
  if(editId){
    var ex=DB.invoices.find(function(x){return x.id===editId;});
    if(!ex)return toast('Faktura nenalezena','error');
    var useOid=oids[0]||0;
    var useClient=useOid?((go(useOid)&&go(useOid).clientId)||ex.clientId):ex.clientId;
    var updated=Object.assign({},ex,{
      orderId:useOid,
      orderIds:oids,
      clientId:useClient,
      recipient:$('frec').value||ex.recipient,
      items:items,
      amount:amount,
      currency:$('fcu').value||ex.currency,
      paymentMethod:$('fpm').value||ex.paymentMethod||'hotovost',
      dueDate:$('fdu').value||ex.dueDate,
      issued:$('fiss').value||ex.issued,
      duzp:$('fduzp').value||ex.duzp,
      number:$('finv').value||ex.number
    });
    await mut('update','invoices',{id:editId,data:updated});
    toast('Faktura uložena','success');
  }else{
    var primaryClientId=o?o.clientId:'';
    var baseData={orderId:oid,orderIds:oids,clientId:primaryClientId,recipient:$('frec').value,items:items,amount:amount,currency:$('fcu').value,paymentMethod:$('fpm').value||'hotovost',dueDate:$('fdu').value,note:'',issued:$('fiss').value||today(),duzp:$('fduzp').value||today(),number:$('finv').value||nin(),status:'draft'};
    await mut('create','invoices',{data:baseData});
    toast('Faktura vytvořena','success');
  }
  INV_ITEMS=[];closeModal();
}

function expClients(){exportCSV(DB.clients,[{label:'Jméno',key:'name'},{label:'Firma',key:'company'},{label:'Email',key:'email'},{label:'Telefon',key:'phone'},{label:'IČO',key:'ico'},{label:'DIČ',key:'dic'},{label:'Město',key:'city'}],'klienti.csv');}
function expArchive(){exportCSV(DB.orders.filter(function(o){return o.status==='archived';}),[{label:'Název',key:'name'},{label:'Stav',key:'stage'},{label:'Cena',key:'price'},{label:'Deadline',key:'deadline'}],'archiv.csv');}
function expTime(){exportCSV(DB.entries,[{label:'Datum',key:'date'},{label:'Zakázka',fn:function(x){var o=go(x.orderId);return o?o.name:'';}},{label:'Popis',key:'description'},{label:'Délka (min)',fn:function(x){return Math.round((x.duration||0)/60);}}],'cas.csv');}
function expInvoices(){exportCSV(DB.invoices,[{label:'Číslo',key:'number'},{label:'Příjemce',key:'recipient'},{label:'Částka',key:'amount'},{label:'Měna',key:'currency'},{label:'Vystaveno',key:'issued'},{label:'Splatnost',key:'dueDate'},{label:'Stav',key:'status'}],'faktury.csv');}
</script>
</body>
</html>
